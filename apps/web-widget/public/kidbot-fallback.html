<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kidbot Offline Demo</title>
  <link rel="stylesheet" href="./kidbot-fallback.css" />
</head>
<body>
  <div id="kb-app" class="kb-root">
    <div id="kb-demo-notice" class="kb-notice" role="status">
      <strong>Offline demo:</strong> fixed sample content only. This preview does not contact Kidbot tools or AI services.
    </div>
    <header class="kb-header">
      <div class="kb-title">Kidbot Offline Demo</div>
      <nav class="kb-tabs" aria-label="Demo activities">
        <button data-tab="voice" class="kb-tab kb-tab--active">Voice sample</button>
        <button data-tab="comics" class="kb-tab">Comic sample</button>
        <button data-tab="coloring" class="kb-tab">Coloring sample</button>
        <button data-tab="science" class="kb-tab">Science sample</button>
        <button id="kb-fullscreen" class="kb-tab kb-right">Fullscreen</button>
      </nav>
    </header>

    <main class="kb-main">
      <section id="kb-voice" class="kb-panel kb-panel--active">
        <label>Persona <select id="kb-persona"><option value="robot">Robot</option><option value="fairy">Fairy</option><option value="explorer">Explorer</option></select></label>
        <label>Prompt <input id="kb-voice-input" placeholder="Tell me a moon fact!" /></label>
        <div class="kb-row"><button id="kb-voice-send">Show fixed reply</button><button id="kb-voice-speak">Speak sample</button></div>
        <pre id="kb-voice-out" class="kb-out"></pre>
      </section>

      <section id="kb-comics" class="kb-panel">
        <label>Theme <input id="kb-comic-theme" value="A shy dragon makes a friend" disabled /></label>
        <label>Panels <input id="kb-comic-count" type="number" min="2" max="4" value="4" /></label>
        <button id="kb-comic-generate">Show fixed story</button>
        <div id="kb-comic-grid" class="kb-grid"></div>
      </section>

      <section id="kb-coloring" class="kb-panel">
        <label>Scene <input id="kb-color-scene" value="space cat" disabled /></label>
        <button id="kb-color-generate">Show fixed outline</button>
        <div class="kb-color-wrap"><div id="kb-color-svg"></div><canvas id="kb-color-canvas" width="1024" height="1024"></canvas></div>
        <div class="kb-row"><input id="kb-brush" type="color" value="#ff7f50" aria-label="Brush color" /><input id="kb-size" type="range" min="2" max="32" value="8" aria-label="Brush size" /><button id="kb-undo">Undo</button><button id="kb-clear">Clear</button><button id="kb-save">Save PNG</button></div>
      </section>

      <section id="kb-science" class="kb-panel">
        <label>Topic <select id="kb-sci-topic"><option>buoyancy</option></select></label>
        <button id="kb-sci-generate">Show fixed experiment</button>
        <pre id="kb-sci-out" class="kb-out"></pre>
      </section>
    </main>
  </div>
  <script src="./kidbot-fallback.js"></script>
</body>
</html>
