name: Nightly Production Smoke

# The production smokes existed but only ever ran when someone remembered to
# press the button, so nothing was actually watching the deploy between
# releases. This runs the provider-backed path once a day and opens an issue
# when it breaks.
#
# Cost: one story of two panels per night, which is two generated images.

on:
  schedule:
    # 09:17 UTC daily; off the hour so it does not land in the busiest minute.
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-production-smoke
  cancel-in-progress: false

jobs:
  nightly-smoke:
    name: Nightly Production Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    env:
      KIDBOT_REMOTE_MCP_URL: ${{ secrets.KIDBOT_REMOTE_MCP_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 8.15.8

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify production MCP URL secret
        run: |
          if [ -z "$KIDBOT_REMOTE_MCP_URL" ]; then
            echo "KIDBOT_REMOTE_MCP_URL is required as a protected production environment secret."
            exit 1
          fi

      - name: Check deployed release posture
        run: pnpm run smoke:production-release -- --attempts 3 --delay-ms 10000

      - name: Verify production readiness and widget artifact
        run: pnpm run smoke:production-widget-dist-preflight

      - name: Run production MCP story panels smoke
        run: pnpm run smoke:production-mcp-story-panels

      - name: Report nightly failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='Nightly production smoke is failing'
          gh label create nightly-smoke --color B60205 --description 'Scheduled production smoke failure' --force
          existing="$(gh issue list --state open --label nightly-smoke --search "$title in:title" --json number --jq '.[0].number // empty')"
          body="$(printf 'The nightly production smoke failed.\n\nRun: %s\nCommit: %s\n\nCheck both /healthz endpoints before redeploying; the release step names the condition that failed.' "$RUN_URL" "$GITHUB_SHA")"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label nightly-smoke --body "$body"
          fi
