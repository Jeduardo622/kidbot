name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  full-stack:
    name: Full Stack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: '1'
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 8.15.8

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Resolve engineering harness base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/resolve-harness-base.mjs >> "$GITHUB_ENV"

      - name: Route engineering change
        run: |
          HARNESS_ROUTE_REPORT="$RUNNER_TEMP/harness-route.json"
          node ./scripts/route-task.mjs --base "$HARNESS_BASE" --json > "$HARNESS_ROUTE_REPORT"
          cat "$HARNESS_ROUTE_REPORT"
          node scripts/export-harness-classification.mjs "$HARNESS_ROUTE_REPORT" >> "$GITHUB_ENV"

      - name: Verify review-only baseline
        if: env.HARNESS_CLASSIFICATION == 'review-only'
        run: pnpm run verify:local

      - name: Verify engineering change
        run: pnpm run verify-change -- --base "$HARNESS_BASE"

      - name: Test agent-service with Redis limiter smoke
        env:
          RATE_LIMIT_STORE: redis
        run: pnpm --filter @kidbot/agent-service exec vitest run --coverage.enabled=false

      - name: Run provider preflight config check
        run: pnpm run smoke:provider-preflight:ci

      - name: Build web-widget
        run: pnpm --filter @kidbot/web-widget run build

      - name: Run MCP parent profile store tests
        env:
          PARENT_AUTH_SECRET: parent-secret-abcdefghijklmnopqrstuvwxyz0123456789
        run: pnpm --filter @kidbot/mcp-server run test:parent-store

      - name: Run parent store Redis deploy smoke
        run: pnpm run smoke:parent-store-redis

      - name: Run secured deploy posture smoke
        run: pnpm run smoke:secured-posture

      - name: Run MCP auth/startup matrix
        run: pnpm --filter @kidbot/mcp-server run test:auth-matrix
