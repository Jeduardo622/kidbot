name: Deploy Verify

# Railway deploys main on its own. This proves the deploy actually landed:
# it waits for both services to report the pushed commit and a production-ready
# posture, so a silently failed or rolled-back release is visible in minutes
# instead of at the next manual smoke. Read-only; no provider spend.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      commit:
        description: Commit the deployed services must report (defaults to this ref)
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-verify
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify Production Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    env:
      KIDBOT_REMOTE_MCP_URL: ${{ secrets.KIDBOT_REMOTE_MCP_URL }}
      EXPECTED_COMMIT: ${{ inputs.commit || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 8.15.8

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify production MCP URL secret
        run: |
          if [ -z "$KIDBOT_REMOTE_MCP_URL" ]; then
            echo "KIDBOT_REMOTE_MCP_URL is required as a protected production environment secret."
            exit 1
          fi

      - name: Wait for the deployed release
        run: pnpm run smoke:production-release -- --expect-commit "$EXPECTED_COMMIT" --attempts 40 --delay-ms 15000

      - name: Verify production readiness and widget artifact
        run: pnpm run smoke:production-widget-dist-preflight
